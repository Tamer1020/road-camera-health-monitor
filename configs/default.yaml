# road-health default configuration
#
# This file is a documented copy of the built-in defaults. A config may be
# partial: anything you omit keeps its default value.
#
# Two conventions run through the whole file:
#
#   * Temporal thresholds are in SECONDS, never frames. They are converted
#     using (source fps / analysis.stride), so the same file behaves the same
#     on a 10 fps and a 30 fps camera.
#   * Detection thresholds prefixed `rel_` are fractions of THIS CAMERA's
#     baseline median. Thresholds prefixed `abs_` are absolute fallbacks used
#     only when no baseline is available; a run that uses them says so in
#     run_metadata.json.

analysis:
  max_side: 640
  stride: 1
  roi: null
  tile_rows: 6
  tile_cols: 8
  fallback_fps: 25.0

baseline:
  mode: auto
  path: null
  warmup_seconds: 4.0
  min_warmup_frames: 25

output:
  write_video: true
  video_codec: mp4v
  annotate_stride: 1
  csv: true
  events: true
  metadata: true

checks:
  blur:
    enabled: true
    severity: DEGRADED
    enter_seconds: 2.0
    exit_seconds: 4.0
    params:
      rel_min: 0.35
      abs_min: 6.0
      exposure_lo: 0.55
      exposure_hi: 1.60

  dark:
    enabled: true
    severity: DEGRADED
    enter_seconds: 2.0
    exit_seconds: 4.0
    params:
      abs_mean_luma: 35.0
      rel_mean_luma: 0.45
      clip_low_frac: 0.35

  bright:
    enabled: true
    severity: DEGRADED
    enter_seconds: 2.0
    exit_seconds: 4.0
    params:
      abs_mean_luma: 205.0
      clip_high_frac: 0.20

  low_contrast:
    enabled: true
    severity: DEGRADED
    enter_seconds: 3.0
    exit_seconds: 5.0
    params:
      rel_span: 0.50
      abs_span: 30.0
      exposure_lo: 0.55
      exposure_hi: 1.60
      max_clip_frac: 0.05

  blocked:
    enabled: true
    severity: UNUSABLE
    enter_seconds: 3.0
    exit_seconds: 5.0
    params:
      tile_rel_std: 0.35
      tile_rel_edge: 0.30
      tile_abs_std: 4.0
      gain_floor: 0.25
      uniform_std_max: 3.0
      exposure_lo: 0.35
      exposure_hi: 1.90
      dead_tile_frac: 0.35

  frozen:
    enabled: true
    severity: UNUSABLE
    enter_seconds: 2.0
    exit_seconds: 1.0
    params:
      noise_ratio: 0.20
      abs_mad: 0.05
      min_noise_sigma: 0.25

  moved:
    enabled: true
    severity: UNUSABLE
    enter_seconds: 3.0
    exit_seconds: 5.0
    params:
      shift_frac: 0.04
      edge_corr_min: 0.25

  shake:
    enabled: true
    severity: DEGRADED
    enter_seconds: 3.0
    exit_seconds: 5.0
    params:
      jitter_frac: 0.0012
      window_seconds: 1.0
